[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-relocate"
version = "0.1.0"
description = "A small Windows utility to move Codex folders, verify every file, and keep old paths working."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ASEXPIAO"}]
dependencies = []
classifiers = ["Development Status :: 4 - Beta", "Operating System :: Microsoft :: Windows",
               "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
codex-relocate = "codex_relocate.__main__:main"

[tool.setuptools.packages.find]
include = ["codex_relocate*"]
